<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Rail Operations</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="top-bar">
  <button id="btn-settings" title="设置">⚙</button>
  <span id="gold-label">资金: <strong id="gold-val">500</strong></span>
  <span id="delivered-label">今日: <strong id="delivered-val">0</strong> 人</span>
  <span id="day-label">周期: <strong id="day-val">1</strong></span>
  <div id="time-control">
    <span id="time-display">⏱ --:--</span>
    <button id="time-dropdown-btn">▾</button>
    <div id="time-dropdown" class="hidden">
      <button id="btn-pause">暂停</button>
      <div class="speed-btns">
        <button id="btn-speed1" class="speed-btn active-speed">1x</button>
        <button id="btn-speed2" class="speed-btn">2x</button>
        <button id="btn-speed3" class="speed-btn">3x</button>
        <button id="btn-speed5" class="speed-btn">5x</button>
        <button id="btn-speed10" class="speed-btn">10x</button>
      </div>
    </div>
  </div>
</div>

<div id="main-area">
  <div id="sidebar">
    <div id="shop-panel">
      <h3>商店</h3>
      <div class="shop-item">
        <div class="shop-row">
          <span>轨道碎片</span>
          <span class="shop-val"><strong id="res-track">30</strong></span>
          <span class="price-text">10g</span>
        </div>
        <div class="shop-row shop-btns">
          <button class="buy-btn" data-resource="trackFragment" data-count="1">1</button>
          <button class="buy-btn" data-resource="trackFragment" data-count="5">5</button>
          <button class="buy-btn" data-resource="trackFragment" data-count="10">10</button>
        </div>
      </div>
      <div class="shop-item">
        <div class="shop-row">
          <span>站台组件</span>
          <span class="shop-val"><strong id="res-platform">5</strong></span>
          <span class="price-text">30g</span>
        </div>
        <div class="shop-row shop-btns">
          <button class="buy-btn" data-resource="platformComponent" data-count="1">1</button>
          <button class="buy-btn" data-resource="platformComponent" data-count="5">5</button>
          <button class="buy-btn" data-resource="platformComponent" data-count="10">10</button>
        </div>
      </div>
      <div class="shop-item">
        <div class="shop-row">
          <span>车厢库存</span>
          <span class="shop-val"><strong id="res-wagon">4</strong></span>
          <span class="price-text">50g</span>
        </div>
        <div class="shop-row shop-btns">
          <button class="buy-btn" data-resource="wagon" data-count="1">1</button>
          <button class="buy-btn" data-resource="wagon" data-count="5">5</button>
          <button class="buy-btn" data-resource="wagon" data-count="10">10</button>
        </div>
      </div>
      <div class="shop-row">
        <span>当前资金</span>
        <span class="shop-val"><strong id="sidebar-gold">500</strong>g</span>
      </div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>
<div id="right-panel" class="hidden"></div>
</div>

<div id="bottom-bar">
  <button id="tool-track" class="tool-btn build-only active">铺轨</button>
  <button id="tool-platform" class="tool-btn build-only">站台</button>
  <button id="tool-eraser" class="tool-btn build-only">拆除</button>
  <span id="operate-tools" class="hidden">
    <button id="btn-operate-stop" class="tool-btn">启停</button>
    <button id="btn-operate-reverse" class="tool-btn">调头</button>
  </span>
  <button id="btn-start-day" class="primary-btn bottom-start-btn build-only" style="margin-left:auto">开始运营 ▸</button>
</div>

<div id="overlay" class="overlay hidden">

  <div id="settlement-panel" class="panel hidden">
    <h2>结算</h2>
    <p>今日运送: <strong id="settle-delivered">0</strong> 人</p>
    <p>收入: <strong id="settle-income">0</strong> 金</p>
    <p>维护费: <strong id="settle-maintenance">30</strong> 金</p>
    <hr>
    <p>当前资金: <strong id="settle-gold">500</strong> 金</p>
    <button id="btn-settle-continue" class="primary-btn">下一周期 ▸</button>
  </div>

  <div id="gameover-panel" class="panel hidden">
    <h2>破产！</h2>
    <p>总运送: <strong id="gameover-total">0</strong> 人</p>
    <p>存活周期: <strong id="gameover-days">1</strong></p>
    <button id="btn-restart" class="primary-btn secondary">重新开始</button>
  </div>
</div>

<div id="settings-overlay" class="overlay hidden">
  <div id="settings-panel" class="settings-panel">
    <h2>⚙ 设置</h2>
    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="tab-save">存档</button>
      <button class="settings-tab" data-tab="tab-game">游戏</button>
      <button class="settings-tab" data-tab="tab-ui">界面</button>
    </div>
    <div id="tab-save" class="settings-content">
      <button id="btn-manual-save" class="settings-btn">💾 手动保存</button>
      <hr>
      <label>导出存档</label>
      <textarea id="ta-export" class="settings-ta" readonly></textarea>
      <button id="btn-copy-export" class="settings-btn">📋 一键复制</button>
      <hr>
      <label>导入存档</label>
      <textarea id="ta-import" class="settings-ta" placeholder="在此粘贴 Base64 存档文本..."></textarea>
      <button id="btn-confirm-import" class="settings-btn">确认导入</button>
      <hr>
      <button id="btn-delete-save" class="settings-btn danger">删除存档</button>
      <button id="btn-reset-game" class="settings-btn danger">重置游戏</button>
    </div>
    <div id="tab-game" class="settings-content hidden">暂未开放</div>
    <div id="tab-ui" class="settings-content hidden">暂未开放</div>
    <br>
    <button id="btn-settings-close" class="settings-btn">关闭</button>
  </div>
</div>

<script src="js/gameState.js"></script>
<script src="js/gridGraph.js"></script>
<script src="js/station.js"></script>
<script src="js/train.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
